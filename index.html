<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-4">

<div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-blue-500 mb-8 text-center uppercase">Maintenance Store Inventory</h1>
    
    <h2 class="text-2xl font-bold text-white mb-4">Latest Usage History</h2>
    <div class="bg-slate-900 rounded-2xl border border-slate-700 overflow-x-auto mb-10">
        <table class="w-full text-left">
            <thead class="bg-blue-900 text-white text-xs uppercase">
                <tr><th class="p-4">Date</th><th class="p-4">Item</th><th class="p-4">Room</th><th class="p-4">Used Qty</th></tr>
            </thead>
            <tbody id="historyTable" class="divide-y divide-slate-800"></tbody>
        </table>
    </div>

    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <input id="cat" placeholder="Category" class="bg-slate-800 p-3 rounded border border-slate-700">
            <input id="desc" placeholder="Item Description" class="bg-slate-800 p-3 rounded border border-slate-700">
            <input id="total" type="number" placeholder="Total Qty" class="bg-slate-800 p-3 rounded border border-slate-700">
            <input id="used" type="number" placeholder="Used Qty" class="bg-slate-800 p-3 rounded border border-slate-700">
            <input id="room" placeholder="Room No" class="bg-slate-800 p-3 rounded border border-slate-700">
        </div>
        <button id="mainBtn" onclick="processData()" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 py-3 rounded font-bold transition">Add Item</button>
    </div>

    <table class="w-full text-left bg-slate-900 rounded-2xl border border-slate-700">
        <thead class="bg-slate-800 text-slate-400 text-xs uppercase">
            <tr><th class="p-4">Category</th><th class="p-4">Item</th><th class="p-4">Total</th><th class="p-4">Used</th><th class="p-4">Balance</th><th class="p-4">Room</th><th class="p-4">Actions</th></tr>
        </thead>
        <tbody id="adminTable" class="divide-y divide-slate-800"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAO0KQ1SiBbSn2zbEFCJB12G_gPyIkd4KQ",
        authDomain: "livework-ab49e.firebaseapp.com",
        databaseURL: "https://livework-ab49e-default-rtdb.firebaseio.com",
        projectId: "livework-ab49e",
        storageBucket: "livework-ab49e.firebasestorage.app",
        messagingSenderId: "867860944613",
        appId: "1:867860944613:web:5862be8910c4622a0a260c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let editKey = null;

    // Load History
    db.ref('usage_history').orderByChild('timestamp').limitToLast(10).on('value', snapshot => {
        const tbody = document.getElementById('historyTable');
        tbody.innerHTML = '';
        const data = [];
        snapshot.forEach(child => { data.unshift(child.val()); });
        data.forEach(item => {
            tbody.innerHTML += `<tr class="bg-slate-800/50"><td class="p-4">${item.date || ''}</td><td class="p-4 font-semibold text-white">${item.item || 'N/A'}</td><td class="p-4 text-blue-400 font-bold">${item.room || ''}</td><td class="p-4 font-bold text-emerald-400">${item.qty || 0}</td></tr>`;
        });
    });

    // Load Inventory
    db.ref('inventory').on('value', snapshot => {
        const tbody = document.getElementById('adminTable');
        tbody.innerHTML = '';
        snapshot.forEach(child => {
            const d = child.val();
            tbody.innerHTML += `<tr class="hover:bg-slate-800/50"><td class="p-4">${d.category}</td><td class="p-4 font-semibold">${d.description}</td><td class="p-4">${d.total}</td><td class="p-4">${d.used}</td><td class="p-4 font-bold text-green-400">${d.total - d.used}</td><td class="p-4">${d.room}</td><td class="p-4 flex gap-3"><button onclick="prepareEdit('${child.key}', '${d.category}', '${d.description}', ${d.total}, ${d.used}, '${d.room}')" class="text-blue-400 font-bold">Edit</button><button onclick="deleteItem('${child.key}')" class="text-red-500 font-bold">Del</button></td></tr>`;
        });
    });

    function processData() {
        const data = { category: document.getElementById('cat').value, description: document.getElementById('desc').value, total: parseInt(document.getElementById('total').value) || 0, used: parseInt(document.getElementById('used').value) || 0, room: document.getElementById('room').value };
        if (editKey) { db.ref('inventory/' + editKey).update(data); } else { db.ref('inventory').push(data); }
        location.reload();
    }

    function prepareEdit(key, cat, desc, total, used, room) {
        editKey = key;
        document.getElementById('cat').value = cat; document.getElementById('desc').value = desc; document.getElementById('total').value = total; document.getElementById('used').value = used; document.getElementById('room').value = room;
        document.getElementById('mainBtn').innerText = "Update Item";
    }

    function deleteItem(key) { if(confirm('Delete?')) db.ref('inventory/' + key).remove(); }
</script>
</body>
</html>
